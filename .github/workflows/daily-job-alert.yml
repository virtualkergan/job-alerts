name: Daily Job Alert

on:
  schedule:
    - cron: "47 11 * * *"  # ~7:47am EDT - off the top-of-hour to avoid GitHub's known scheduling delays there (adjust for your timezone / DST)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to commit the updated state.json back

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python main.py

      - name: Commit updated state
        if: success() || failure()  # run after a failed check too, but not when cancelled
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached && exit 0
          git commit -m "Update job alert state"
          git pull --rebase
          git push
