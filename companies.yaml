- name: "MetLife"
  platform: "html_scrape"
  listing_url: "https://www.metlifecareers.com/en_US/ml/SearchJobs/?listFilterMode=1&jobRecordsPerPage=6"
  # Confirmed working: the site hard-caps results at 6 per page (it ignores
  # requests for more), and pages through with a jobOffset param rather
  # than a normal ?page=N - offset must step by the real page size (6),
  # not a guessed one, or pages get skipped or duplicated.
  pagination: "offset_param"
  offset_param_name: "jobOffset"
  per_page: 6
  # Confirmed working against a live test run.
  link_pattern: "JobDetail"
  keywords: ["actuari", "analyst", "consultant"]

- name: "Fidelity"
  platform: "html_scrape"
  listing_url: "https://jobs.fidelity.com/en/jobs"
  link_pattern: "/en/jobs/\\d+/"
  keywords: ["actuari", "analyst", "consultant"]

- name: "First Citizens Bank"
  platform: "attract_api"
  base_url: "https://jobs.firstcitizens.com"
  keywords: ["actuari", "analyst", "consultant"]
