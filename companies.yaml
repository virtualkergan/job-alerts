# ============================================================
# Companies to monitor for new job postings.
#
# To add a company: copy a block below, change the values, save.
# No code changes needed for platforms already supported
# (workday, attract_api, marsh_phenom, html_scrape, oracle_hcm, taleo,
# ukg, eightfold).
#
# platform options:
#   workday      -> company uses Workday for its career site
#                    (tenant.wd_number.myworkdayjobs.com/site); optional
#                    applied_facets copies a filter from the site's URL, and
#                    country: "United States of America" filters server-side
#                    (Workday locations don't name the country)
#   attract_api  -> company's career site has the iCIMS-backed /api/jobs
#                    JSON endpoint (confirmed: First Citizens Bank, Aon)
#   html_scrape  -> generic: we read the search-results page's HTML
#   marsh_phenom -> Marsh McLennan's specific Phenom /widgets endpoint
#                    (found via live browser inspection; fairly specific
#                    to this one site's exact payload shape)
#   oracle_hcm   -> Oracle Recruiting Cloud (*.fa.ocs.oraclecloud.com/
#                    hcmUI/CandidateExperience/en/sites/{site})
#   taleo        -> Taleo careersection boards (*.taleo.net)
#   ukg          -> UKG Pro / UltiPro job boards (recruiting*.ultipro.com)
#   eightfold    -> Eightfold AI career sites (/api/apply/v2/jobs)
#
# allow_empty: true -> zero postings is normal for this company (small
# employers), so don't treat an empty fetch as a broken connector.
#
# Every company reports all US postings. To narrow one down, add e.g.
#   keywords: ["actuari", "analyst"]
# (a case-insensitive match on the job title).
#
# html_scrape can also read each posting's location/date from the listing
# page via CSS selectors: card_selector matches the element wrapping one
# job, and location_selector / posted_selector are looked up inside it.
# Without a location, a posting can't be identified as non-US, so it's kept.
# ============================================================

- name: "Willis Towers Watson"
  platform: "html_scrape"
  listing_url: "https://careers.wtwco.com/jobs/search"
  card_selector: "tr"
  location_selector: "td.job-search-results-location li"
  # The listing page doesn't show a posted date.

- name: "Aon"
  platform: "attract_api"
  base_url: "https://jobs.aon.com"
  # Confirmed working against a live test run.

- name: "Marsh McLennan Agency"
  platform: "marsh_phenom"
  base_url: "https://careers.marsh.com"
  rk: "l-mma-search"
  page_name: "MMA Search"
  page_id: "page55-prod-ds"
  business_filter: ["Marsh McLennan Agency"]
  # Confirmed working against a live test run (~400 unique postings,
  # matching the site's own displayed count) - found by driving a real
  # browser and reading its network traffic directly, not by guessing.

- name: "MetLife"
  platform: "html_scrape"
  listing_url: "https://www.metlifecareers.com/en_US/ml/SearchJobs/?listFilterMode=1&jobRecordsPerPage=6"
  # Confirmed working: the site hard-caps results at 6 per page (it ignores
  # requests for more), and pages through with a jobOffset param rather
  # than a normal ?page=N - offset must step by the real page size (6),
  # not a guessed one, or pages get skipped or duplicated.
  pagination: "offset_param"
  offset_param_name: "jobOffset"
  per_page: 6
  # Confirmed working against a live test run.
  link_pattern: "JobDetail"
  card_selector: "article.article--result"
  location_selector: ".list-item-location"
  posted_selector: ".list-item-posted"

- name: "Fidelity"
  platform: "html_scrape"
  listing_url: "https://jobs.fidelity.com/en/jobs"
  link_pattern: "/en/jobs/\\d+/"
  card_selector: ".card-job"
  location_selector: ".job-meta li:nth-of-type(2)"
  posted_selector: ".job-meta li:first-child span:nth-of-type(2)"

- name: "First Citizens Bank"
  platform: "attract_api"
  base_url: "https://jobs.firstcitizens.com"

# ---- Insurance carriers / actuarial employers (added 2026-10-06) ----

- name: "NC Rate Bureau"
  platform: "html_scrape"
  listing_url: "https://www.ncrb.org/Careers-and-Working-With-Us"
  pagination: "none"
  # Openings are hand-placed links in the "Available Positions" content
  # block (empty when checked); there's no ATS behind it.
  link_selector: "#dnn_ctr4288_ContentPane a[href]"
  link_pattern: "^(?!mailto:)."
  allow_empty: true

- name: "NC Department of Insurance"
  platform: "workday"
  tenant: "nc"
  wd_number: "wd108"
  site: "NC_Careers"
  # State of NC's Workday site, filtered to DOI (linked from ncdoi.gov/careers).
  applied_facets:
    hiringCompany: ["4c5533ba0a02100160ecda24adf40000"]
  allow_empty: true

- name: "Allstate"
  platform: "workday"
  tenant: "allstate"
  wd_number: "wd5"
  site: "allstate_careers"
  country: "United States of America"

- name: "State Farm"
  platform: "attract_api"
  base_url: "https://jobs.statefarm.com"

- name: "Pinnacle Actuarial Resources"
  platform: "html_scrape"
  listing_url: "https://www.pinnacleactuaries.com/careers"
  pagination: "none"
  # The careers page links each opening to its Paycom posting.
  link_pattern: "paycomonline\\.net"
  allow_empty: true

- name: "Zurich North America"
  platform: "html_scrape"
  # Zurich's global SuccessFactors site, searched for US locations.
  listing_url: "https://www.careers.zurich.com/search/?q=&locationsearch=United+States"
  pagination: "offset_param"
  offset_param_name: "startrow"
  per_page: 25
  link_pattern: "/job/"
  card_selector: "tr.data-row"
  location_selector: "td.colLocation .jobLocation"
  posted_selector: ".jobDate"

- name: "CNA"
  platform: "workday"
  tenant: "cna"
  wd_number: "wd1"
  site: "CNA_Careers"
  country: "United States of America"

- name: "American Family"
  platform: "html_scrape"
  listing_url: "https://careers.amfam.com/jobs/"
  link_pattern: "/jobs/r\\d+/"
  card_selector: ".card-job"
  location_selector: ".job-meta li:first-child"
  # The listing page doesn't show a posted date.

- name: "Acuity"
  platform: "ukg"
  board_url: "https://recruiting2.ultipro.com/HER1001ACFIN/JobBoard/ab33798a-3521-417b-8db8-a8e435c475fa/"

